<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>원소 난투 (프로토타입)</title>
    <style>
        html, body { margin: 0; height: 100%; background: #14161c; color: #e8e8ee;
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
        canvas { background: #1d2029; border-radius: 10px; box-shadow: 0 0 0 1px #2c3040; cursor: crosshair;
            max-width: 100vw; }
        .help { font-size: 13px; color: #9aa0b4; }
        .help b { color: #e8e8ee; }
    </style>
</head>
<body>
<canvas id="game" width="960" height="640"></canvas>
<div class="help">
    <b>WASD</b> 이동 · <b>마우스</b> 조준 · <b>좌클릭</b> 기본 공격 · <b>Q / E</b> 스킬 · <b>R</b> 필살기 ·
    <b>Esc</b> 캐릭터 다시 고르기
</div>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
</body>
</html>
