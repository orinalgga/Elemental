<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>원소 난투</title>
    <style>
        html, body { margin: 0; height: 100%; background: #14161c; color: #e8e8ee;
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
        canvas { background: #1d2029; border-radius: 10px; box-shadow: 0 0 0 1px #2c3040; cursor: crosshair;
            max-width: 100vw; }
        .help { font-size: 13px; color: #9aa0b4; }
        .help b { color: #e8e8ee; }
        .stage { position: relative; }
        #join { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(10, 12, 18, .72); border-radius: 10px; }
        #join[hidden] { display: none; }
        #join .card { background: #232735; border: 1px solid #3a3f55; border-radius: 12px; padding: 22px 26px;
            width: min(320px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 12px; }
        #join h2 { margin: 0; font-size: 18px; }
        #join label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #9aa0b4; }
        #join input { font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid #3a3f55;
            background: #171a23; color: #e8e8ee; text-transform: none; }
        #join-room { text-transform: uppercase; }
        #join .row { display: flex; gap: 8px; }
        #join button { flex: 1; font: inherit; font-size: 15px; padding: 9px; border-radius: 8px; border: 0; cursor: pointer; }
        #join button[type=submit] { background: #e0a83a; color: #1a1406; font-weight: 700; }
        #join-back { background: #33384a; color: #e8e8ee; }
        #join .hint { font-size: 12px; color: #7d8398; margin: 0; }
    </style>
</head>
<body>
<div class="stage">
    <canvas id="game" width="960" height="640"></canvas>
    <form id="join" hidden autocomplete="off">
        <div class="card">
            <h2>방 입장 · <span id="join-char"></span></h2>
            <label>이름 <input id="join-name" maxlength="10" placeholder="최대 10자"></label>
            <label>방 코드 <input id="join-room" maxlength="12" placeholder="LOBBY"></label>
            <p class="hint">같은 방 코드를 입력한 친구와 대결해요 (2~4명). 혼자면 연습 모드예요.</p>
            <div class="row">
                <button type="button" id="join-back">뒤로</button>
                <button type="submit">입장</button>
            </div>
        </div>
    </form>
</div>
<div class="help">
    <b>WASD</b> 이동 · <b>마우스</b> 조준 · <b>좌클릭</b> 기본 공격 · <b>Q / E</b> 스킬 · <b>R</b> 필살기 ·
    <b>Esc</b> 방 나가기
</div>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
</body>
</html>
