# 장기 앱과 같은 Oracle VM에 함께 올리는 구성. 게임 화면(정적 파일)도 이 서버가 같이 내준다.
# HTTPS는 장기 앱의 caddy가 맡는다. 배포 서버의 .env에서 COMPOSE_FILE로 deploy/compose.janggi.yml을 더한다(docs/deploy.md).
# 로컬에서 도커로 띄우기: docker compose up --build  →  http://localhost:8082
services:
  server:
    # 배포 VM은 GitHub Actions가 만든 이 이미지를 받아 쓴다(deploy/update.sh). 로컬에서는 --build로 직접 만든다.
    image: ghcr.io/orinalgga/elemental-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    # 장기 앱이 8080, 추모 앱이 8081을 쓰므로 8082로 연다. 그 컴퓨터 안에서만 열린다.
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      DATA_DIR: /data
      # 메모리가 작은 VM에서는 .env에 JAVA_TOOL_OPTIONS=-Xmx256m 처럼 힙을 줄인다.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    # 계정과 전적(H2 파일 DB). 따로 DB 컨테이너가 필요 없다.
    volumes:
      - gamedata:/data
    restart: unless-stopped

volumes:
  gamedata:
