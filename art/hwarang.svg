<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1e4"/>
      <stop offset="1" stop-color="#ffd9bf"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a5a"/>
      <stop offset="1" stop-color="#f2552c"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f1d10"/>
      <stop offset="0.55" stop-color="#e2541f"/>
      <stop offset="1" stop-color="#ffd24a"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a45"/>
      <stop offset="1" stop-color="#f06a2a"/>
    </linearGradient>
    <linearGradient id="flameOut" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4d1c"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
    <linearGradient id="flameIn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd23a"/>
      <stop offset="1" stop-color="#fff6c4"/>
    </linearGradient>
  </defs>

  <g stroke="#3a1712" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- 뒷머리: 동글동글한 단발 -->
    <path d="M58 140 Q48 122 56 104 Q44 84 60 66 Q62 42 88 34 Q108 20 130 24 Q156 20 174 36 Q198 44 198 70 Q212 90 200 108 Q208 128 194 142 Q184 152 176 140 L80 140 Q70 152 58 140 Z" fill="#e2482a"/>

    <!-- 등 뒤 후드 -->
    <path d="M104 166 Q100 150 116 148 L142 148 Q158 150 154 166 Z" fill="#ff6b3d"/>

    <!-- 뒤쪽 팔: 소매와 손가락 없는 장갑 -->
    <path d="M158 170 Q174 178 176 196" fill="none" stroke="#3a1712" stroke-width="15" stroke-linecap="round"/>
    <path d="M158 170 Q174 178 176 196" fill="none" stroke="#232a40" stroke-width="10.5" stroke-linecap="round"/>
    <circle cx="177" cy="202" r="7" fill="#2b2b33"/>

    <!-- 다리 -->
    <rect x="109" y="214" width="12" height="16" fill="url(#skin)"/>
    <rect x="138" y="214" width="12" height="16" fill="url(#skin)"/>
    <!-- 운동화 -->
    <path d="M100 236 Q100 228 110 228 L120 228 Q128 230 128 238 L128 243 L100 243 Z" fill="#ffffff"/>
    <path d="M132 236 Q132 228 142 228 L152 228 Q162 230 162 238 L162 243 L132 243 Z" fill="#ffffff"/>
    <path d="M100 240 L128 240 M132 240 L162 240" stroke="#ff6b3d" stroke-width="3"/>
    <path d="M112 232 L120 232 M144 232 L152 232" stroke="#ff6b3d" stroke-width="2"/>

    <!-- 반바지 -->
    <path d="M100 202 L158 202 L160 220 L132 220 L129 212 L126 220 L98 220 Z" fill="#2f3550"/>
    <path d="M100 204 L98 220 M158 204 L160 220" stroke="#ff6b3d" stroke-width="2.5"/>

    <!-- 안쪽 흰 티셔츠 -->
    <path d="M110 166 L148 166 L150 206 L108 206 Z" fill="#ffffff"/>
    <g transform="translate(122 180) scale(0.3)" stroke-width="6">
      <path d="M4 40 C-8 24 4 14 10 4 C12 14 18 16 22 8 C26 18 36 12 38 2 C48 16 52 30 40 42 Z" fill="url(#flameOut)"/>
    </g>

    <!-- 짧은 후드 재킷 (열린 지퍼) -->
    <path d="M96 176 Q100 166 114 163 L120 163 L118 206 L94 204 Q92 190 96 176 Z" fill="#232a40"/>
    <path d="M162 176 Q158 166 144 163 L138 163 L140 206 L164 204 Q166 190 162 176 Z" fill="#232a40"/>
    <path d="M118 165 L117 204 M140 165 L141 204" stroke="#ff6b3d" stroke-width="2.5"/>
    <path d="M150 168 Q160 174 162 186 L164 204 L154 205 Z" fill="#1a2033" stroke="none"/>
    <!-- 벨트와 파우치 -->
    <path d="M100 204 L158 204" stroke="#5a3a2a" stroke-width="5"/>
    <rect x="125" y="200" width="9" height="8" rx="1.5" fill="#f4b23c" stroke-width="1.8"/>
    <rect x="143" y="202" width="14" height="12" rx="3" fill="#7a4a2a"/>

    <!-- 앞쪽 팔: 소매와 손가락 없는 장갑 -->
    <path d="M102 172 Q86 182 84 198" fill="none" stroke="#3a1712" stroke-width="16" stroke-linecap="round"/>
    <path d="M102 172 Q86 182 84 198" fill="none" stroke="#2c3550" stroke-width="11.5" stroke-linecap="round"/>
    <path d="M78 192 L90 196" stroke="#ff6b3d" stroke-width="3"/>
    <path d="M77 204 Q77 196 85 196 Q93 196 93 204 Q93 212 85 212 Q77 212 77 204 Z" fill="#2b2b33"/>
    <path d="M78 199 Q85 197 92 200" fill="none" stroke="url(#skin)" stroke-width="3"/>

    <!-- 목 -->
    <rect x="120" y="150" width="20" height="16" fill="#f7c9a8"/>

    <!-- 귀 -->
    <ellipse cx="70" cy="116" rx="9" ry="12" fill="url(#skin)"/>
    <path d="M70 110 Q74 116 70 122" fill="none" stroke="#e8a98a" stroke-width="2"/>

    <!-- 얼굴 -->
    <path d="M68 100 C68 62 100 48 128 48 C162 48 188 66 188 102 C188 132 170 150 146 160 C136 164 124 164 114 160 C88 150 68 130 68 100 Z" fill="url(#skin)"/>

    <!-- 옆머리: 볼을 감싸는 동그란 머리카락 -->
    <path d="M66 98 Q58 128 68 148 Q80 154 86 142 Q80 122 86 102 Z" fill="url(#hair)"/>
    <path d="M190 98 Q198 126 188 146 Q176 152 172 140 Q178 120 174 102 Z" fill="url(#hair)"/>
    <!-- 앞머리: 둥근 물결 -->
    <path d="M64 106 C58 62 94 40 130 40 C168 40 196 62 192 108 Q186 92 176 92 Q170 106 158 100 Q154 84 144 82 Q138 100 126 98 Q116 96 114 80 Q106 96 96 98 Q88 98 88 88 Q78 94 76 110 Q70 100 64 106 Z" fill="url(#hair)"/>
    <!-- 머리 그림자 -->
    <path d="M152 48 C168 54 182 68 186 86 Q180 78 174 78 C170 64 162 54 152 48 Z" fill="#d9401f" stroke="none"/>
    <!-- 바보털 -->
    <path d="M126 42 C120 26 132 14 146 18 C140 22 134 28 136 40 Z" fill="url(#hair)"/>
    <!-- 천사 고리 하이라이트 -->
    <path d="M86 66 Q128 48 174 64" fill="none" stroke="#ffd0b4" stroke-width="5" opacity="0.9"/>
    <!-- 눈썹 -->
    <path d="M92 90 Q104 84 116 88" fill="none" stroke-width="4"/>
    <path d="M146 88 Q156 84 166 88" fill="none" stroke-width="4"/>
  </g>

  <!-- 눈 (선 없이 겹쳐 그림) -->
  <g>
    <!-- 앞쪽 눈 -->
    <path d="M92 108 Q92 96 106 96 Q120 96 120 108 L120 120 Q120 132 106 132 Q92 132 92 120 Z" fill="#ffffff"/>
    <ellipse cx="108" cy="116" rx="11" ry="15" fill="url(#iris)"/>
    <ellipse cx="109" cy="114" rx="5" ry="7.5" fill="#4a0f08"/>
    <ellipse cx="103" cy="107" rx="4.5" ry="5.5" fill="#ffffff"/>
    <circle cx="113" cy="124" r="2.2" fill="#ffffff"/>
    <path d="M88 104 Q96 92 110 93 Q120 94 124 102 L126 98" fill="none" stroke="#2a0e0a" stroke-width="5" stroke-linecap="round"/>
    <path d="M94 131 Q106 135 118 130" fill="none" stroke="#7a3a2a" stroke-width="1.6"/>

    <!-- 뒤쪽 눈 (원근으로 좁게) -->
    <path d="M146 108 Q146 96 157 96 Q168 96 168 108 L168 120 Q168 132 157 132 Q146 132 146 120 Z" fill="#ffffff"/>
    <ellipse cx="158" cy="116" rx="9" ry="15" fill="url(#iris)"/>
    <ellipse cx="159" cy="114" rx="4.2" ry="7.5" fill="#4a0f08"/>
    <ellipse cx="154" cy="107" rx="3.8" ry="5.5" fill="#ffffff"/>
    <circle cx="162" cy="124" r="2" fill="#ffffff"/>
    <path d="M143 102 Q150 93 160 93 Q170 94 172 104 L175 101" fill="none" stroke="#2a0e0a" stroke-width="5" stroke-linecap="round"/>
    <path d="M148 131 Q157 135 166 130" fill="none" stroke="#7a3a2a" stroke-width="1.6"/>
  </g>

  <!-- 볼, 코, 입 -->
  <ellipse cx="96" cy="138" rx="10" ry="5" fill="#ff8a8a" opacity="0.45"/>
  <ellipse cx="170" cy="136" rx="8" ry="4.5" fill="#ff8a8a" opacity="0.45"/>
  <path d="M90 138 L94 134 M96 139 L100 135 M102 140 L106 136" stroke="#ff7070" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M140 128 L142 131" stroke="#d98a6a" stroke-width="2" stroke-linecap="round"/>
  <path d="M126 140 L154 138 Q150 154 139 154 Q129 153 126 140 Z" fill="#9c2a24" stroke="#3a1712" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M127 141 L153 139 L152 143 L128 145 Z" fill="#ffffff"/>
  <path d="M132 150 Q139 145 147 149 Q141 154 132 150 Z" fill="#ff7a7a"/>

  <!-- 불꽃 머리핀 -->
  <g stroke="#3a1712" stroke-width="2.2" stroke-linejoin="round" transform="translate(70 50) scale(0.62) rotate(-18 24 24)">
    <path d="M4 40 C-8 24 4 14 10 4 C12 14 18 16 22 8 C26 18 36 12 38 2 C48 16 52 30 40 42 Z" fill="url(#flameOut)"/>
    <path d="M12 40 C6 30 14 22 18 16 C20 24 26 24 28 18 C34 26 36 34 30 40 Z" fill="url(#flameIn)" stroke="none"/>
  </g>
</svg>
